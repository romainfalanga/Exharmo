<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expansion Harmonieuse - Interface Cognitive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020205;
        color: #e2e8f0;
      }
      h1, h2, h3, .sacred-text {
        font-family: 'Cinzel', serif;
      }
      pre, code, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .glass-panel {
        backdrop-filter: blur(12px);
      }
      
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.05); opacity: 1; }
        100% { transform: scale(1); opacity: 0.8; }
      }

      /* Flow Animations for System Map */
      @keyframes flowVertical {
        0% { stroke-dashoffset: 100; stroke-dasharray: 5, 5; opacity: 0; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; stroke-dasharray: 5, 5; opacity: 0; }
      }
      
      @keyframes flowHorizontal {
        0% { stroke-dashoffset: 100; stroke-dasharray: 5, 5; opacity: 0; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; stroke-dasharray: 5, 5; opacity: 0; }
      }

      .animate-flow-vertical {
        animation: flowVertical 1s linear infinite;
      }
      
      .animate-flow-horizontal {
        animation: flowHorizontal 1s linear infinite;
      }
      
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #050510;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 2px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
